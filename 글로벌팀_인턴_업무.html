<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>

<title>글로벌팀 인턴 업무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* StyleKorean 디자인 토큰 */
  :root{
    --ground:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F6F6F6;
    --ink:#111111;
    --ink-2:#505050;
    --muted:#767676;
    --line:#EEEEEE;
    --line-2:#DDDDDD;
    --accent:#FC123E;
    --accent-soft:rgba(252,18,62,.08);
    --shadow:0 1px 2px rgba(17,17,17,.04), 0 10px 30px -20px rgba(17,17,17,.28);

    --c-offer:#FC123E;  --c-offer-bg:rgba(252,18,62,.10);
    --c-so:#FF41DB;     --c-so-bg:rgba(255,65,219,.10);
    --c-reg:#2E9BFF;    --c-reg-bg:rgba(84,175,255,.14);
    --c-inci:#7B5CF0;   --c-inci-bg:rgba(123,92,240,.11);
    --c-sku:#F0559F;    --c-sku-bg:rgba(255,107,184,.14);
    --c-img:#E07B00;    --c-img-bg:rgba(255,138,0,.13);
    --c-doc:#00997A;    --c-doc-bg:rgba(0,179,131,.12);
    --c-res:#0F6FD6;    --c-res-bg:rgba(15,111,214,.10);
    --c-etc:#767676;    --c-etc-bg:#F0F0F0;

    --wip:#FC123E;   --wip-bg:rgba(252,18,62,.08);   --wip-line:rgba(252,18,62,.28);
    --hold:#B8730A;  --hold-bg:rgba(255,138,0,.12);  --hold-line:rgba(224,123,0,.34);
    --done:#2E9BFF;  --done-bg:rgba(84,175,255,.12); --done-line:rgba(84,175,255,.38);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0C0C0E;
      --surface:#151518;
      --surface-2:#1C1C20;
      --ink:#F2F2F4;
      --ink-2:#C2C2C7;
      --muted:#8B8B92;
      --line:#26262B;
      --line-2:#35353C;
      --accent:#FF3D62;
      --accent-soft:rgba(255,61,98,.14);
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -20px rgba(0,0,0,.8);

      --c-offer:#FF6480;  --c-offer-bg:rgba(252,18,62,.18);
      --c-so:#FF74E4;     --c-so-bg:rgba(255,65,219,.16);
      --c-reg:#6EB9FF;    --c-reg-bg:rgba(84,175,255,.16);
      --c-inci:#A992F7;   --c-inci-bg:rgba(123,92,240,.18);
      --c-sku:#FF8FC6;    --c-sku-bg:rgba(255,107,184,.16);
      --c-img:#FFA63D;    --c-img-bg:rgba(255,138,0,.16);
      --c-doc:#3FCFAC;    --c-doc-bg:rgba(0,179,131,.16);
      --c-res:#5FA6F5;    --c-res-bg:rgba(15,111,214,.18);
      --c-etc:#9A9AA2;    --c-etc-bg:#25252A;

      --wip:#FF6480;   --wip-bg:rgba(252,18,62,.15);   --wip-line:rgba(255,100,128,.36);
      --hold:#FFB74D;  --hold-bg:rgba(255,138,0,.16);  --hold-line:rgba(255,183,77,.36);
      --done:#6EB9FF;  --done-bg:rgba(84,175,255,.14); --done-line:rgba(110,185,255,.36);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C0C0E;
    --surface:#151518;
    --surface-2:#1C1C20;
    --ink:#F2F2F4;
    --ink-2:#C2C2C7;
    --muted:#8B8B92;
    --line:#26262B;
    --line-2:#35353C;
    --accent:#FF3D62;
    --accent-soft:rgba(255,61,98,.14);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -20px rgba(0,0,0,.8);

    --c-offer:#FF6480;  --c-offer-bg:rgba(252,18,62,.18);
    --c-so:#FF74E4;     --c-so-bg:rgba(255,65,219,.16);
    --c-reg:#6EB9FF;    --c-reg-bg:rgba(84,175,255,.16);
    --c-inci:#A992F7;   --c-inci-bg:rgba(123,92,240,.18);
    --c-sku:#FF8FC6;    --c-sku-bg:rgba(255,107,184,.16);
    --c-img:#FFA63D;    --c-img-bg:rgba(255,138,0,.16);
    --c-doc:#3FCFAC;    --c-doc-bg:rgba(0,179,131,.16);
    --c-res:#5FA6F5;    --c-res-bg:rgba(15,111,214,.18);
    --c-etc:#9A9AA2;    --c-etc-bg:#25252A;

    --wip:#FF6480;   --wip-bg:rgba(252,18,62,.15);   --wip-line:rgba(255,100,128,.36);
    --hold:#FFB74D;  --hold-bg:rgba(255,138,0,.16);  --hold-line:rgba(255,183,77,.36);
    --done:#6EB9FF;  --done-bg:rgba(84,175,255,.14); --done-line:rgba(110,185,255,.36);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:Pretendard,"Pretendard Variable",Inter,"Noto Sans KR",
                "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.005em;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:0}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px 96px}

  /* ---- masthead ---- */
  header.mast{
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .mast-in{max-width:1080px;margin:0 auto;padding:40px 24px 32px;display:flex;flex-direction:column;gap:18px}

  /* intern tabs */
  .tabs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin-bottom:-2px}
  button.tab{
    font-family:inherit;font-size:14px;font-weight:500;
    padding:9px 13px 10px;cursor:pointer;
    background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);transition:color .12s,border-color .12s;
    display:inline-flex;align-items:baseline;gap:7px;
  }
  button.tab:hover{color:var(--ink)}
  button.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  button.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

  .tab-x{
    font-size:15px;line-height:1;color:var(--muted);opacity:.4;
    padding:0 1px;border-radius:4px;transition:opacity .12s,color .12s;
    align-self:center;
  }
  button.tab:hover .tab-x,button.tab[aria-selected="true"] .tab-x{opacity:.7}
  .tab-x:hover{opacity:1!important;color:var(--accent)}
  .tab-x:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:1px}

  button.tab.tab-add{
    font-size:17px;font-weight:400;padding:6px 12px 8px;color:var(--muted);
    line-height:1;align-self:center;
  }
  button.tab.tab-add:hover{color:var(--accent)}

  .tab-add-form{display:inline-flex;align-items:center;gap:5px;padding:4px 4px 6px}
  .tab-add-form input{
    font-family:inherit;font-size:13.5px;padding:5px 9px;width:120px;
    border:1px solid var(--line-2);border-radius:6px;
    background:var(--surface);color:var(--ink);
  }
  .tab-add-form input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .tab-add-form button{
    font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
    padding:5px 11px;border-radius:6px;
    background:var(--accent);color:#fff;border:1px solid var(--accent);
  }

  .tab-confirm{
    display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;margin:0 2px 5px;
    font-size:12.5px;color:var(--ink-2);
    background:var(--accent-soft);border:1px solid var(--line-2);border-radius:6px;
    align-self:center;
  }
  .tab-confirm button{
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    padding:3px 9px;border-radius:5px;border:1px solid transparent;
  }
  .tab-confirm .yes{background:var(--accent);color:#fff}
  .tab-confirm .no{background:transparent;color:var(--muted);border-color:var(--line-2)}
  .tab-confirm button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .placeholder{
    margin-top:56px;padding:56px 28px;text-align:center;
    border:1px dashed var(--line-2);border-radius:6px;background:var(--surface);
  }
  .placeholder h3{margin:0 0 8px;font-size:17px;font-weight:600}
  .placeholder p{margin:0 auto;max-width:44ch;font-size:14px;color:var(--muted);line-height:1.65}

  /* progress meter */
  .progress{display:flex;flex-direction:column;gap:7px}
  .progress-top{
    display:flex;align-items:baseline;gap:10px;
    font-family:Inter,Pretendard,system-ui,sans-serif;font-size:12.5px;
    color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .progress-top b{font-size:15px;color:var(--ink);font-weight:600}
  .progress-track{
    height:8px;border-radius:3px;background:var(--surface-2);overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-track i{display:block;height:100%;background:var(--done);transition:width .25s ease}
  /* ---- StyleKorean 로고 ---- */
  .logo{
    font-family:"M PLUS Rounded 1c",Pretendard,system-ui,sans-serif;
    font-weight:800;font-size:clamp(30px,4.6vw,40px);line-height:1;
    letter-spacing:-.02em;color:var(--ink);
    display:inline-flex;align-items:flex-start;user-select:none;
  }
  .logo .k{
    position:relative;display:inline-block;
    background:linear-gradient(128deg,#FF3FD1 4%,#B266F0 46%,#4FA8FF 96%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .logo .spark{
    position:absolute;top:-.10em;right:-.30em;width:.42em;height:.42em;overflow:visible;
  }
  .logo .spark path{fill:#C05CF2}

  /* ---- 네비게이션 (햄버거 + 필) ---- */
  .sknav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  button.ham{
    width:34px;height:30px;padding:5px 3px;cursor:pointer;
    background:none;border:none;border-radius:6px;
    display:inline-flex;flex-direction:column;justify-content:space-between;flex:0 0 auto;
  }
  button.ham span{display:block;height:2.5px;border-radius:2px;background:var(--ink);transition:background .12s}
  button.ham span:nth-child(1){width:100%}
  button.ham span:nth-child(2){width:100%}
  button.ham span:nth-child(3){width:100%}
  button.ham:hover span{background:var(--accent)}
  button.ham[aria-expanded="true"] span{background:var(--accent)}
  button.ham:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button.pill{
    font-family:inherit;font-size:14px;font-weight:500;letter-spacing:-.01em;
    padding:8px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:var(--surface-2);border:1px solid transparent;color:var(--ink);
    transition:background .12s,color .12s,border-color .12s;
  }
  button.pill:hover{background:var(--line);}
  button.pill[aria-current="true"]{background:var(--ink);color:var(--ground);}
  button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- 햄버거 패널 ---- */
  .ham-panel{
    border:1px solid var(--line-2);border-radius:6px;background:var(--surface);
    box-shadow:var(--shadow);padding:16px 18px 18px;max-width:460px;
  }
  .ham-panel h3{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:-.01em}
  .ham-panel .hint{margin:0 0 13px;font-size:12.5px;color:var(--muted);line-height:1.55}
  .cat-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:1px}
  .cat-list li{
    display:flex;align-items:center;gap:10px;padding:8px 4px 8px 10px;
    border-radius:6px;background:var(--surface-2);font-size:13.5px;
  }
  .cat-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-list li .rm{
    background:none;border:none;cursor:pointer;font-size:16px;line-height:1;
    color:var(--muted);padding:2px 8px;border-radius:5px;
  }
  .cat-list li .rm:hover{color:var(--accent)}
  .cat-list li .rm:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cat-empty{font-size:12.5px;color:var(--muted);padding:10px 0 14px}
  .cat-add{display:flex;gap:6px}
  .cat-add input{
    flex:1;font-family:inherit;font-size:13.5px;padding:8px 11px;
    border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);
  }
  .cat-add input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .cat-add button{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:8px 16px;border-radius:6px;
    background:var(--ink);color:var(--ground);border:1px solid var(--ink);
  }
  .cat-add button:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- 가이드라인 화면 ---- */
  .guide{margin-top:40px}
  .guide-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
  .guide-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .guide-head .tag{font-size:12px;color:var(--muted)}
  .guide textarea{
    width:100%;margin-top:18px;min-height:56vh;resize:vertical;
    font-family:inherit;font-size:14.5px;line-height:1.75;color:var(--ink);
    background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
    padding:18px 20px;
  }
  .guide textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .guide .saved{margin-top:8px;font-size:12px;color:var(--muted);min-height:1.2em}

  h1{
    margin:0;font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.02em;
    line-height:1.2;text-wrap:balance;
  }
  .period{
    font-family:Inter,Pretendard,system-ui,sans-serif;
    font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  }

  /* ---- stats ---- */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  }
  .stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
  .stat b{
    letter-spacing:-.03em;
    font-family:Inter,Pretendard,system-ui,sans-serif;
    font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .stat span{font-size:12px;color:var(--muted);letter-spacing:.02em}

  /* ---- controls ---- */
  .controls{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    margin:0 -24px 0;padding:12px 24px;
  }
  .ctl-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;max-width:1032px;margin:0 auto}
  .ctl-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ctl-label{
    font-family:Inter,Pretendard,system-ui,sans-serif;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin-right:2px;
  }
  button.chip{
    font-family:inherit;font-size:12.5px;font-weight:500;
    padding:4px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
    transition:background .12s,color .12s,border-color .12s;
  }
  button.chip:hover{border-color:var(--accent);color:var(--accent)}
  button.chip[aria-pressed="true"]{
    background:var(--ink);border-color:var(--ink);color:var(--ground);
  }
  button.chip:focus-visible,select:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  select.pick{
    font-family:inherit;font-size:12.5px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  }
  .count-live{
    margin-left:auto;font-family:Inter,Pretendard,system-ui,sans-serif;
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  /* ---- 슬랙 자동 수집 상태 ---- */
  .sync{
    display:flex;align-items:center;gap:9px;margin-top:14px;
    padding:9px 13px;border-radius:6px;font-size:12.5px;
    background:var(--surface-2);color:var(--ink-2);
  }
  .sync .dot{
    width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto;
  }
  .sync.busy .dot{background:var(--c-res);animation:pulse 1.1s ease-in-out infinite}
  .sync.ok{background:var(--c-doc-bg);color:var(--c-doc)}
  .sync.ok .dot{background:var(--c-doc)}
  .sync.warn{background:var(--accent-soft);color:var(--accent)}
  .sync.warn .dot{background:var(--accent)}
  .sync.notion{background:var(--c-inci-bg);color:var(--c-inci)}
  .sync.notion .dot{background:var(--c-inci)}
  .sync.notion.ok{background:var(--c-doc-bg);color:var(--c-doc)}
  .sync.notion.ok .dot{background:var(--c-doc)}
  .sync.notion.warn{background:var(--accent-soft);color:var(--accent)}
  .sync.notion.warn .dot{background:var(--accent)}
  .sync .fix{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:600}
  .sync .recheck{
    margin-left:auto;flex:0 0 auto;
    font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
    padding:4px 11px;border-radius:999px;
    background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);
  }
  .sync .recheck:hover{color:var(--ink);border-color:var(--ink)}
  .sync .recheck:disabled{opacity:.45;cursor:default}
  .sync .recheck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .rmeta .atag{
    font-size:11px;font-weight:600;color:var(--c-res);
    background:var(--c-res-bg);padding:1px 7px;border-radius:4px;
  }

  /* ---- 목록 맨 아래 + 버튼 ---- */
  button.addrow{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin-top:14px;padding:16px 12px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;
    color:var(--muted);background:none;
    border:1.5px dashed var(--line-2);border-radius:6px;
    transition:color .12s,border-color .12s,background .12s;
  }
  button.addrow .plus{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;
    background:var(--surface-2);color:var(--ink);font-size:15px;line-height:1;
    transition:background .12s,color .12s;
  }
  button.addrow:hover{color:var(--ink);border-color:var(--ink);border-style:solid}
  button.addrow:hover .plus{background:var(--accent);color:#fff}
  button.addrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- 업무 추가 폼 ---- */
  .addform{
    margin-top:14px;padding:18px 20px 16px;
    border:1px solid var(--line-2);border-radius:6px;background:var(--surface);box-shadow:var(--shadow);
  }
  .af-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
  .af-grid label{
    display:flex;flex-direction:column;gap:5px;
    font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:0;
  }
  .af-grid label.wide{grid-column:1/-1}
  .af-grid .opt{font-weight:400;color:var(--muted)}
  .af-grid input,.af-grid select,.af-grid textarea{
    font-family:inherit;font-size:13.5px;font-weight:400;color:var(--ink);
    padding:8px 11px;border:1px solid var(--line-2);border-radius:6px;
    background:var(--surface);width:100%;
  }
  .af-grid textarea{resize:vertical;line-height:1.6}
  .af-grid input:focus,.af-grid select:focus,.af-grid textarea:focus{
    outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);
  }

/* 날짜를 YYYY-MM-DD 로 정규화 (수집분은 2026년) */
const YONGGI_R = YONGGI.map(r => ["2026-"+r[0], r[1], r[2], r[3], r[4], r[5]]);

/* 이름별 업무 데이터 — 수집된 인턴만 채워집니다 */
const ROWS = { "정용기": YONGGI_R };
const DEFAULT_ROSTER = ["정용기","이세라","김정연"];

let active = roster[0];

let DATA = [];

const rowsFor = n => ROWS[n] || [];
function rangeFor(){
  if(!DATA.length) return "";
  const f = d => d.slice(0,4)+"."+d.slice(5,7)+"."+d.slice(8,10);
  return f(DATA[0][0]) + " – " + f(DATA[DATA.length-1][0]);
}
/* 자동 수집분(baked)과 수동 입력분을 합치되, 같은 슬랙 메시지는 한 번만 보여줍니다.
   슬랙 링크를 넣고 추가한 업무는 id가 메시지 ts라서 자동 수집분과 정확히 대조됩니다. */
function rebuildData(){
  const gone = new Set(deletedIds);
  const base = rowsFor(active).filter(r => !gone.has(r[5]));
  const bakedIds = new Set(rowsFor(active).map(r => r[5]));
  const extras = manualItems.filter(r => !bakedIds.has(r[5]) && !gone.has(r[5]));
  DATA = base.concat(extras)
    .slice().sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
}
/* 자동 수집분에 흡수된 수동 항목은 저장소에서도 정리 */
function pruneManual(){
  const bakedIds = new Set(rowsFor(active).map(r => r[5]));
  const before = manualItems.length;
  manualItems = manualItems.filter(r => !bakedIds.has(r[5]));
  if(manualItems.length !== before) saveManual();
}
/* 슬랙 permalink 에서 메시지 ts 추출 → 중복 판별 키 */
function tsFromUrl(u){
  const m = (u || "").match(/\/p(\d{10,20})/);
  return m ? m[1] : null;
}
function monthsIn(){
  return [...new Set(DATA.map(r => r[0].slice(0,7)))].sort();
}
function monthLabel(ym){
  return ym.slice(0,4) + "년 " + (+ym.slice(5,7)) + "월";
}
/* 한글 이름을 안전한 문서 경로로 바꾸는 짧은 해시 */
function slug(s){
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8,"0");
}

/* ---------- status store (db capability, localStorage fallback) ----------
   상태는 진행중 → 회신대기 → 완료 → 진행중 순서로 순환합니다.
   저장 형식은 이전 버전과 호환됩니다: 값이 없으면 '완료', "wip" 는 '진행중'.
   "hold"(회신대기)만 새로 추가된 값이라 기존 기록은 그대로 읽힙니다. */
let STATUS = {};
let dbHandle = null, dbRef = null, unsub = null, saveTimer = null;

const lsKey = () => "gt-intern-status-v3-" + slug(active);
function readLocal(){
  try{ return JSON.parse(localStorage.getItem(lsKey()) || "{}"); }catch(e){ return {}; }
}
function writeLocal(){
  try{ localStorage.setItem(lsKey(), JSON.stringify(STATUS)); }catch(e){}
}
const STATES = ["wip", "hold", "done"];
const STATE_LABEL = { wip: "진행중", hold: "회신대기", done: "완료" };
const NOTION_STATE = { wip: "진행중", hold: "회신대기", done: "완료" };

function stateOf(id){
  const v = STATUS[id];
  return v === "wip" ? "wip" : v === "hold" ? "hold" : "done";
}
function nextOf(st){ return STATES[(STATES.indexOf(st) + 1) % STATES.length]; }
function isDone(id){ return stateOf(id) === "done"; }

/* 조사 선택: 종성이 없거나 ㄹ 이면 '로', 그 밖에는 '으로' */
function ro(w){
  const c = (w || "").charCodeAt((w || "").length - 1) - 0xAC00;
  const jong = (c >= 0 && c <= 11171) ? c % 28 : -1;
  return (jong === 0 || jong === 8) ? "로" : "으로";
}
function btnTitle(st){
  const n = STATE_LABEL[nextOf(st)];
  return "클릭하면 " + n + ro(n) + " 바뀝니다";
}
function statusBtnHtml(st){
  return '<button class="status" data-s="' + st + '" aria-pressed="'
    + (st === "done" ? "true" : "false") + '" title="' + btnTitle(st) + '">'
    + (st === "done" ? '<span class="tick">✓</span>완료' : STATE_LABEL[st])
    + '</button>';
}

function setState(id, st){
  if(st === "done") delete STATUS[id]; else STATUS[id] = st;
  writeLocal();
  if(dbRef){
    clearTimeout(saveTimer);
    const ref = dbRef;
    saveTimer = setTimeout(() => {
      ref.set({ map: STATUS, updatedAt: new Date().toISOString() }).catch(()=>{});
    }, 350);
  }
}

async function initStore(){
  if(unsub){ try{ unsub(); }catch(e){} unsub = null; }
  dbRef = null;
  STATUS = readLocal();
  paintAll();

  if(dbHandle === null){
    dbHandle = await useCapability("db");
    if(!dbHandle) dbHandle = false;
    if(dbHandle){ initRoster(); initGuides(); initManual(); initNotes(); initDeleted(); initNotion().then(notionBackfill); }
  }
  if(!dbHandle) return;                       // localStorage only

  const key = active;
  try{
    const ref = dbHandle.doc("status/v3-" + slug(key));
    dbRef = ref;
    unsub = ref.onSnapshot(snap => {
      if(active !== key) return;
      if(snap.exists && snap.data() && snap.data().map){
        STATUS = Object.assign({}, snap.data().map);
        writeLocal();
        paintAll();
      }
    }, () => {});
  }catch(e){ dbRef = null; }
}

/* repaint every visible row + counters from STATUS */
function paintAll(){
  document.querySelectorAll("li.row").forEach(li => {
    const id = li.dataset.id;
    const st = stateOf(id);
    li.classList.toggle("is-done", st === "done");
    li.classList.toggle("is-hold", st === "hold");
    const b = li.querySelector("button.status");
    if(b) applyBtn(b, st);
  });
  updateProgress();
  if(fStatus !== "all") render();
}
function applyBtn(b, st){
  b.dataset.s = st;
  b.setAttribute("aria-pressed", st === "done" ? "true" : "false");
  b.innerHTML = st === "done" ? '<span class="tick">✓</span>완료' : STATE_LABEL[st];
  b.title = btnTitle(st);
}
function updateProgress(){
  let done = 0, hold = 0, wip = 0;
  DATA.forEach(r => {
    const s = stateOf(r[5]);
    if(s === "done") done++; else if(s === "hold") hold++; else wip++;
  });
  const total = DATA.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("pctLabel").textContent = pct + "%";
  document.getElementById("progLabel").textContent =
    `완료 ${done}건 · 회신대기 ${hold}건 · 진행중 ${wip}건`;
  document.getElementById("progBar").style.width = pct + "%";
}

/* ---------- stats ---------- */
function buildStats(){
  const whos = new Set();
  DATA.forEach(r => whos.add(r[2]));
  const work = DATA.filter(r => r[1] !== "etc").length;

  const el = document.getElementById("stats");
  const cells = [
    ["총 태그 건수", DATA.length],
    ["실제 업무 요청", work],
    ["요청자", whos.size + "명"],
    ["최다 요청 유형", topCat()],
    ["최다 요청자", topWho()]
  ];
  el.innerHTML = cells.map(([label,val]) =>
    `<div class="stat"><b>${val}</b><span>${label}</span></div>`).join("");
  document.getElementById("periodLine").innerHTML =
    `${rangeFor()} · 총 <span>${DATA.length}</span>건`;
}
function topCat(){
  const c = {};
  DATA.forEach(r => { if(r[1]!=="etc") c[r[1]] = (c[r[1]]||0)+1; });
  const k = Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
  return k ? CATS[k].n : "—";
}
function topWho(){
  const c = {};
  DATA.forEach(r => c[r[2]] = (c[r[2]]||0)+1);
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0] || "—";
}

/* ---------- intern tabs (직접 추가·삭제) ---------- */
let adding = false, pendingDelete = null, pendingRow = null;

function buildTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = "";

  roster.forEach(name => {
    const on = name === active;
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", on ? "true":"false");
    b.innerHTML = `<span>${esc(name)} 인턴</span>`;
    b.onclick = () => switchTo(name);

    if(roster.length > 1){
      const x = document.createElement("span");
      x.className = "tab-x";
      x.setAttribute("role","button");
      x.tabIndex = 0;
      x.title = name + " 탭 삭제";
      x.textContent = "×";
      const del = ev => { ev.stopPropagation(); ev.preventDefault(); pendingDelete = name; buildTabs(); };
      x.onclick = del;
      x.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" ") del(ev); };
      b.appendChild(x);
    }

    t.appendChild(b);

    if(pendingDelete === name){
      const c = document.createElement("span");
      c.className = "tab-confirm";
      const n2 = rowsFor(name).length;
      c.innerHTML = `<span>삭제할까요?${n2 ? ` (업무 ${n2}건)` : ""}</span>`;
      const yes = document.createElement("button");
      yes.type = "button"; yes.className = "yes"; yes.textContent = "삭제";
      yes.onclick = () => removeIntern(name);
      const no = document.createElement("button");
      no.type = "button"; no.className = "no"; no.textContent = "취소";
      no.onclick = () => { pendingDelete = null; buildTabs(); };
      c.appendChild(yes); c.appendChild(no);
      t.appendChild(c);
    }
  });

  if(adding){
    const form = document.createElement("form");
    form.className = "tab-add-form";
    form.innerHTML = `<input type="text" maxlength="20" placeholder="인턴 이름" aria-label="추가할 인턴 이름" autocomplete="off">
      <button type="submit" title="추가">추가</button>`;
    form.onsubmit = ev => {
      ev.preventDefault();
      addIntern(form.querySelector("input").value);
    };
    form.querySelector("input").onkeydown = ev => {
      if(ev.key === "Escape"){ adding = false; buildTabs(); }
    };
    t.appendChild(form);
    setTimeout(()=>{ const i = form.querySelector("input"); if(i) i.focus(); }, 0);
  }else{
    const add = document.createElement("button");
    add.className = "tab tab-add";
    add.title = "인턴 탭 추가";
    add.setAttribute("aria-label","인턴 탭 추가");
    add.textContent = "+";
    add.onclick = () => { adding = true; buildTabs(); };
    t.appendChild(add);
  }
}

function addIntern(raw){
  pendingDelete = null;
  const name = (raw || "").trim().replace(/\s+/g," ").replace(/\s*인턴$/,"");
  if(!name){ adding = false; buildTabs(); return; }
  if(roster.includes(name)){ adding = false; switchTo(name); buildTabs(); return; }
  roster.push(name);
  adding = false;
  saveRoster();
  switchTo(name);
  buildTabs();
}

function removeIntern(name){
  pendingDelete = null;
  if(roster.length <= 1) { buildTabs(); return; }
  const i = roster.indexOf(name);
  if(i < 0){ buildTabs(); return; }
  roster.splice(i, 1);
  saveRoster();
  if(active === name) switchTo(roster[Math.max(0, i-1)], true);
  buildTabs();
}

function switchTo(name, force){
  pendingDelete = null;
  if(name === active && !force) { buildTabs(); return; }
  active = name;
  loadManualLocal();
  pruneManual();
  rebuildData();
  fMonth = "all"; fCat = "all"; fWho = "all"; fStatus = "all";
  addForm.hidden = true;
  buildTabs();
  applyShell();
  if(DATA.length){ buildStats(); buildFilters(); render(); }
  initStore();
  initManual();
  loadNotesLocal();
  loadDeletedLocal();
  initNotes();
  initDeleted();
  initNotion().then(notionBackfill);
  syncedFor = null;
  document.getElementById("syncBar").hidden = true;
  syncSlack();
  window.scrollTo({top:0, behavior:"smooth"});
}

function applyShell(){
  if(typeof view !== "undefined" && view !== "tasks") return;
  const has = DATA.length > 0;
  ["progressBlock","stats","controls","legendBlock"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.hidden = !has;
  });
  document.getElementById("periodLine").hidden = !has;
  if(!has){
    document.getElementById("list").innerHTML =
      `<div class="placeholder">
         <h3>${esc(active)} 인턴 업무 기록은 아직 비어 있습니다</h3>
         <p>아래 <b>+ 업무 추가</b>로 직접 기록하시거나, 슬랙에서 ${esc(active)} 인턴이 태그된 업무를 수집해 채워 넣으시려면 알려주세요.</p>
       </div>` + ADD_ROW;
  }
}

/* 마지막 기록 다음 날부터 조회 */
function sinceDate(){
  if(!DATA.length) return "2026-05-01";
  const last = DATA[DATA.length - 1][0];
  const d = new Date(last + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - 1);        // 경계 누락 방지
  return d.toISOString().slice(0,10);
}

/* 검색 결과 마크다운에서 메시지 단위로 분해 */
function parseSlack(raw){
  const out = [];
  raw.split(/^###\s+Result\s+/m).slice(1).forEach(block => {
    const ts   = (block.match(/^Message_ts:\s*([\d.]+)\s*$/m) || [])[1];
    const time = (block.match(/^Time:\s*(\d{4}-\d{2}-\d{2})/m) || [])[1];
    const from = block.match(/^From:\s*(.+?)\s*(?:<[^>]*>)?\s*\(ID:\s*(U[A-Z0-9]+)\)/m);
    if(!ts || !time || !from) return;
    let text = (block.split(/^Text:\s*$/m)[1] || "");
    text = text.split(/^Context (?:before|after):/m)[0].split(/^---$/m)[0].trim();
    if(!text) return;
    out.push({
      id: ts.replace(".", ""),
      date: time,
      from: from[1].trim(),
      fromId: from[2],
      text: text.slice(0, 900)
    });
  });
  return out;
}

/* 요청자 표시용 이름 정리: "KR CA 글로벌2 권민정(mjkwon) 대리" → "권민정" */
function shortName(s){
  const m = s.match(/([가-힣]{2,4})\s*(?:\([^)]*\))?\s*(?:사원|대리|과장|차장|부장|팀장|인턴)?\s*$/);
  return m ? m[1] : s.split(/\s+/).pop().replace(/\([^)]*\)/g,"").trim();
}

function mcpFail(e){
  const c = e && e.code;
  if(c === "not_granted" || c === "capability_disabled" || c === "capability_removed"){
    document.getElementById("syncBar").hidden = true; return;
  }
  if(c === "server_not_connected")
    return syncStatus('슬랙 자동 수집을 쓰려면 claude.ai 설정 → 커넥터에서 <b>Slack</b>을 추가해 주세요.', "warn");
  if(c === "needs_reauth")
    return syncStatus('슬랙 연결이 만료되었습니다. 설정 → 커넥터에서 다시 연결해 주세요.', "warn");
  if(c === "selection_required")
    return syncStatus('사용할 슬랙 커넥터를 선택해 주세요.', "warn");
  if(c === "blocked_by_policy" || c === "approval_required")
    return syncStatus('조직 정책으로 슬랙 조회가 제한되어 있습니다. 직접 추가는 그대로 사용할 수 있습니다.', "warn");
  if(c === "tool_error")
    return syncStatus('슬랙 조회에 실패했습니다: ' + esc(String(e.message || "")).slice(0,120), "warn");
  return syncStatus('슬랙을 잠시 조회할 수 없습니다. 기존 목록은 그대로 표시됩니다.', "warn");
}

async function syncSlack(force){
  const who = active;
  const uid = SLACK_IDS[who];
  if(!uid){ document.getElementById("syncBar").hidden = true; return; }
  if(syncing) return;
  if(!force && syncedFor === who) return;
  syncedFor = who;
  syncing = true;
  lastCheck = Date.now();
  const btn = document.getElementById("recheckBtn");
  if(btn) btn.disabled = true;
  try{ await runSync(who, uid, force); }
  finally{ syncing = false; if(btn) btn.disabled = false; }
}

async function runSync(who, uid, force){

  let mcp = null;
  mcp = await useCapability("mcp");
  if(!mcp){ document.getElementById("syncBar").hidden = true; return; }

  syncStatus("슬랙에서 새 업무를 확인하는 중…", "busy");

  const query = `in:#${SLACK_CHANNEL} <@${uid}> after:${sinceDate()}`;
  let res;
  try{
    res = await mcp.callTool("Slack", "slack_search_public_and_private", {
      query,
      sort: "timestamp",
      sort_dir: "asc",
      limit: 20,
      include_context: false
    }, force ? { cache: { refresh: true } } : { cache: { staleTime: 60000 } });
  }catch(e){ return mcpFail(e); }

  if(active !== who) return;

  const p = res && res.payload;
  const raw = typeof p === "string" ? p
            : (p && typeof p.results === "string") ? p.results
            : (res.content || []).map(c => c.text || "").join("\n");
  if(!raw){ return syncStatus("슬랙 응답을 읽지 못했습니다.", "warn"); }

  const known = new Set(DATA.map(r => r[5]));
  const fresh = parseSlack(raw)
    .filter(m => !known.has(m.id) && m.fromId !== uid)
    .slice(0, 12);

  if(!fresh.length){
    return syncStatus("최신 상태입니다. 새로 태그된 업무가 없습니다.", "ok");
  }

  syncStatus(`새 업무 ${fresh.length}건을 정리하는 중…`, "busy");

  let sample = null;
  sample = await useCapability("sample");

  let parsed = null;
  if(sample){
    const cats = Object.keys(CATS).map(k => `- ${k}: ${CATS[k].n} — ${CATS[k].d}`).join("\n");
    const prompt =
`K-뷰티 유통사 글로벌팀의 업무 기록을 정리합니다.
아래는 슬랙 채널에서 ${who} 인턴이 태그된 새 메시지입니다. 각 메시지를 업무 기록 한 건으로 정리하세요.

카테고리 코드:
${cats}

규칙:
- title: 명사형 짧은 업무명 (예: "SKU 코드 기입", "글B 오퍼리스트 작성", "CPNP 번호 확인")
- detail: 거래처명·제품코드·기한 등 핵심만 한두 문장. 인사말과 감사 표현은 제외
- 기한 표현("금일 중", "당일 15시까지", "긴급" 등)은 원문 그대로 detail 에 남길 것
- 업무 요청이 아니라 회의·교육·공지면 cat 은 "etc"
- 입력 메시지 수와 출력 배열 길이를 반드시 같게, ts 는 입력값 그대로

JSON 배열만 출력:
[{"ts":"...","cat":"...","title":"...","detail":"..."}]

메시지:
${JSON.stringify(fresh.map(m => ({ts:m.id, from:shortName(m.from), text:m.text})))}`;
    try{
      parsed = await sample.json(prompt, { modelTier: "default" });
    }catch(e){ parsed = null; }
  }

  if(active !== who) return;

  const byTs = {};
  if(Array.isArray(parsed)) parsed.forEach(o => { if(o && o.ts) byTs[String(o.ts)] = o; });

  let added = 0;
  fresh.forEach(m => {
    if(manualItems.some(r => r[5] === m.id)) return;
    const o = byTs[m.id] || {};
    const cat = CATS[o.cat] ? o.cat : "etc";
    const title = (o.title || m.text.split("\n")[0].replace(/<@[^>]+>/g,"").trim().slice(0,60) || "업무 요청").trim();
    const detail = (o.detail || m.text.replace(/<@[^>]+>/g,"").replace(/\s+/g," ").trim().slice(0,220)).trim();
    manualItems.push([m.date, cat, shortName(m.from), title, detail, m.id, "", "a"]);
    setState(m.id, "wip");        // 새로 들어온 업무는 '진행중'으로 시작
    added++;
  });

  if(!added) return syncStatus("최신 상태입니다.", "ok");

  saveManual();
  refreshTasks();
  notionBackfill();
  syncStatus(
    `새 업무 <b>${added}건</b>을 추가했습니다.` +
    (parsed ? "" : " 자동 분류에 실패해 원문 그대로 넣었으니 제목·유형을 확인해 주세요."),
    parsed ? "ok" : "warn"
  );
}

const NOTION_DS = "3bab243c-a6c8-46c8-8b35-9de6aabd1887";
const NOTION_DB_URL = "https://app.notion.com/p/c6930b66ba924643a780201cb4af5e11";

let nMap = {};                 // { 업무id: 노션 page id }
let nRef = null, nUnsub = null, nBusy = false, nQueue = new Set(), nTimer = null;

function nStatus(msg, cls){

async function initNotion(){

/* 노션 「요청자」는 고정 select 입니다. 목록에 없는 값을 보내면
   notion-create-pages 가 validation_error 400 으로 배치 전체를 거부합니다.
   (세션에서 실제 호출로 확인한 스키마 옵션 목록) */
const NOTION_REQUESTERS = new Set([
  "권민정","김시은","박승현","방하영","양우정","문지영","최아영","김은진",
  "홍민주","안수현","신동훈","이선경","좌이랑","신은재","박서현","김은성","송혜린"
]);

/* 노션 날짜 속성은 ISO 8601(YYYY-MM-DD) 이어야 합니다.
   DATA 의 "05-11" 같은 월-일 값은 에러 없이 엉뚱한 날짜로 저장되므로
   슬랙 ts 에서 연도를 복원해 full ISO 로 만들어 보냅니다. */
function toIsoDate(r){
  const raw = String(r[0] || "").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  const md = raw.match(/^(\d{1,2})-(\d{1,2})$/);
  if(!md) return null;
  const mm = md[1].padStart(2,"0"), dd = md[2].padStart(2,"0");
  const ts = String(r[5] || "");
  if(/^\d{10,}$/.test(ts)){
    const d = new Date(parseInt(ts.slice(0,10),10) * 1000);
    if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  }
  const now = new Date();
  let y = now.getUTCFullYear();
  if(new Date(y+"-"+mm+"-"+dd+"T00:00:00Z").getTime() - now.getTime() > 7*864e5) y -= 1;
  return y+"-"+mm+"-"+dd;
}

/* 업무 한 건 → 노션 속성 */
function toNotionProps(r){
  const p = {
    "제목": r[3] || "(제목 없음)",
    "인턴": active,
    "업무유형": (CATS[r[1]] || CATS.etc).n,
    "진행상태": NOTION_STATE[stateOf(r[5])],
    "당일마감": isUrgent(r) ? "__YES__" : "__NO__"
  };

  const iso = toIsoDate(r);
  if(iso) p["date:날짜:start"] = iso;

  /* select 옵션에 있는 이름만 보내고, 없으면 상세내용에 남겨 보존합니다 */
  const who = (r[2] || "").trim();
  let detail = r[4] || "";
  if(who && NOTION_REQUESTERS.has(who)) p["요청자"] = who;
  else if(who) detail = "[요청자: " + who + "] " + detail;
  p["상세내용"] = detail;

  const note = NOTES[r[5]];
  if(note) p["진행현황"] = note;
  const link = r[7] === "m" ? (r[6] || "") : (P + r[5]);
  if(link) p["슬랙링크"] = link;
  return p;
}

async function getMcp(){
  return await useCapability("mcp");
}

/* 아직 노션에 없는 업무를 만들어 넣습니다 (첫 실행 시 전체 backfill) */
async function notionBackfill(){
  if(nBusy) return;
  const missing = DATA.filter(r => !nMap[r[5]]);
  if(!missing.length){ const b=document.getElementById("notionBar"); if(b) b.hidden = true; return; }

  const mcp = await getMcp();
  if(!mcp){ const b=document.getElementById("notionBar"); if(b) b.hidden = true; return; }

  nBusy = true;
  const who = active;
  let done = 0, skipped = 0;

  /* 한 번에 여러 건 생성 — 실패하면 그 묶음만 건별로 다시 시도합니다.
     예전에는 한 건이라도 거부되면 배치 전체가 날아갔습니다. */
  async function createChunk(chunk){
    const res = await mcp.callTool("Notion", "notion-create-pages", {
      parent: { type: "data_source_id", data_source_id: NOTION_DS },
      pages: chunk.map(r => ({ properties: toNotionProps(r) }))
    }, { cache: false });
    const pl = res && res.payload;
    const made = (pl && Array.isArray(pl.pages)) ? pl.pages : [];
    made.forEach((pg, idx) => { if(pg && pg.id && chunk[idx]) nMap[chunk[idx][5]] = pg.id; });
    return made.length;
  }

  try{
    for(let i = 0; i < missing.length; i += 25){
      if(active !== who) break;
      const chunk = missing.slice(i, i + 25);
      nStatus(`노션에 업무를 올리는 중… ${done}/${missing.length}`, "busy");
      try{
        done += await createChunk(chunk);
      }catch(e){
        if(e && (e.code === "not_granted" || e.code === "capability_disabled"
              || e.code === "capability_removed" || e.code === "server_not_connected"
              || e.code === "needs_reauth" || e.code === "selection_required"
              || e.code === "blocked_by_policy" || e.code === "approval_required")) throw e;
        /* 묶음 거부 → 건별 재시도, 문제 있는 건만 건너뜁니다 */
        for(const r of chunk){
          if(active !== who) break;
          try{ done += await createChunk([r]); }
          catch(e2){ skipped++; }
        }
      }
      saveNMap();
    }
    let msg;
    if(done) msg = `노션에 <b>${done}건</b> 반영했습니다.`
                 + (skipped ? ` ${skipped}건은 노션 속성값이 맞지 않아 건너뛰었습니다.` : "")
                 + ` <a class="fix" href="${NOTION_DB_URL}" target="_blank" rel="noopener">노션에서 보기</a>`;
    else msg = skipped ? `노션에 반영하지 못했습니다. (${skipped}건 거부)` : "노션에 반영하지 못했습니다.";
    nStatus(msg, done ? (skipped ? "warn" : "ok") : "warn");
  }catch(e){
    notionFail(e);
  }finally{ nBusy = false; }
}

/* 상태·진행현황이 바뀐 건을 노션에 반영 (짧게 모아서 한 번에) */
function notionPush(id){
  nQueue.add(id);
  clearTimeout(nTimer);
  nTimer = setTimeout(flushNotion, 900);
}
async function flushNotion(){
  const ids = [...nQueue]; nQueue.clear();
  if(!ids.length) return;
  const mcp = await getMcp();
  if(!mcp) return;
  let ok = 0, missing = false;
  for(const id of ids){
    const pageId = nMap[id];
    const r = DATA.find(x => x[5] === id);
    if(!r) continue;
    if(!pageId){ missing = true; continue; }
    try{
      await mcp.callTool("Notion", "notion-update-page", {
        page_id: pageId,
        command: "update_properties",
        properties: {
          "진행상태": NOTION_STATE[stateOf(id)],
          "진행현황": NOTES[id] || ""
        }
      }, { cache: false });
      ok++;
    }catch(e){ notionFail(e); return; }
  }
  if(ok) nStatus(`노션에 ${ok}건 반영했습니다.`, "ok");
  if(missing) notionBackfill();
}

/* 삭제한 업무는 노션에서도 '삭제됨' 으로 표시합니다 */
async function notionDelete(id){
  const pageId = nMap[id];
  if(!pageId) return;
  const mcp = await getMcp();
  if(!mcp) return;
  try{
    await mcp.callTool("Notion", "notion-update-page", {
      page_id: pageId,
      command: "update_properties",
      properties: { "진행상태": "삭제됨" }
    }, { cache: false });
  }catch(e){ /* 노션 반영 실패는 삭제 자체를 막지 않습니다 */ }
}

function notionFail(e){
  const c = e && e.code;
  const bar = document.getElementById("notionBar");
  if(c === "not_granted" || c === "capability_disabled" || c === "capability_removed"){
    if(bar) bar.hidden = true; return;
  }
  if(c === "server_not_connected")
    return nStatus('노션 연동을 쓰려면 claude.ai 설정 → 커넥터에서 <b>Notion</b>을 추가해 주세요.', "warn");
  if(c === "needs_reauth")
    return nStatus('노션 연결이 만료되었습니다. 설정 → 커넥터에서 다시 연결해 주세요.', "warn");
  if(c === "selection_required")
    return nStatus('사용할 노션 커넥터를 선택해 주세요.', "warn");
  if(c === "blocked_by_policy" || c === "approval_required")
    return nStatus('조직 정책으로 노션 쓰기가 제한되어 있습니다.', "warn");
  if(c === "tool_error")
    return nStatus('노션 반영 실패: ' + esc(String(e.message || "")).slice(0,120), "warn");
  return nStatus('노션에 잠시 반영할 수 없습니다. 다음에 열 때 다시 시도합니다.', "warn");
}

/* ---------- 진행현황 메모 ---------- */
let NOTES = {};
let notesRef = null, notesUnsub = null, notesTimer = null;

const notesLsKey = () => "gt-notes-v1-" + slug(active);
function loadNotesLocal(){
  try{ NOTES = JSON.parse(localStorage.getItem(notesLsKey()) || "{}") || {}; }
  catch(e){ NOTES = {}; }
}
function saveNotes(){
  try{ localStorage.setItem(notesLsKey(), JSON.stringify(NOTES)); }catch(e){}
  if(notesRef){
    clearTimeout(notesTimer);
    const ref = notesRef;
    notesTimer = setTimeout(() => {
      ref.set({ map: NOTES, updatedAt: new Date().toISOString() }).catch(()=>{});
    }, 400);
  }
}
async function initNotes(){
  if(notesUnsub){ try{ notesUnsub(); }catch(e){} notesUnsub = null; }
  notesRef = null;
  if(!dbHandle) return;
  const key = active;
  try{
    const ref = dbHandle.doc("notes/v1-" + slug(key));
    notesRef = ref;
    notesUnsub = ref.onSnapshot(snap => {
      if(active !== key) return;
      if(document.querySelector(".note-edit")) return;   // 편집 중이면 덮어쓰지 않음
      if(snap.exists && snap.data() && snap.data().map){
        NOTES = Object.assign({}, snap.data().map);
        try{ localStorage.setItem(notesLsKey(), JSON.stringify(NOTES)); }catch(e){}
        if(view === "tasks" && DATA.length) render();
      }
    }, () => {});
  }catch(e){ notesRef = null; }
}

function noteBlock(id){
  const t = NOTES[id];
  return t
    ? `<div class="note" data-note="${id}"><span class="nlabel">진행현황</span><span class="ntext">${esc(t)}</span></div>`
    : `<div class="note empty" data-note="${id}"><span class="nlabel">진행현황</span><span class="ntext">진행현황 남기기</span></div>`;
}

/* 클릭하면 그 자리에서 편집 */
document.addEventListener("click", ev => {
  const box = ev.target.closest(".note");
  if(!box) return;
  const id = box.dataset.note;
  const cur = NOTES[id] || "";
  const wrap = document.createElement("div");
  wrap.className = "note-edit";
  wrap.innerHTML = `<textarea placeholder="예: 3개 브랜드 중 2개 완료, 나머지는 BM 회신 대기 중"></textarea>
    <div class="ne-actions">
      <button type="button" class="ne-save">저장</button>
      <button type="button" class="ne-cancel">취소</button>
      <span class="ne-hint">Ctrl+Enter 저장 · Esc 취소</span>
    </div>`;
  const ta = wrap.querySelector("textarea");
  ta.value = cur;
  box.replaceWith(wrap);
  ta.focus();
  ta.setSelectionRange(cur.length, cur.length);

  const close = () => {
    const fresh = document.createElement("div");
    fresh.innerHTML = noteBlock(id);
    wrap.replaceWith(fresh.firstChild);
  };
  const save = () => {
    const v = ta.value.trim();
    if(v) NOTES[id] = v; else delete NOTES[id];
    saveNotes();
    notionPush(id);
    close();
  };
  wrap.querySelector(".ne-save").onclick = save;
  wrap.querySelector(".ne-cancel").onclick = close;
  ta.onkeydown = e => {
    if(e.key === "Escape"){ e.preventDefault(); close(); }
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
  };
});

/* ---------- render ---------- */
/* 그날 안에 끝내야 하는 요청 */
const URGENT_RX = /금일|당일|오늘|긴급|급히|급하게|시급|즉시|ASAP/i;
const isUrgent = r => URGENT_RX.test(r[3] + " " + r[4]);

const ADD_ROW = `<button class="addrow" id="addRow" type="button">
    <span class="plus">+</span><span>업무 추가</span>
  </button>`;
function catChip(k){
  return `<span class="rcat" style="color:var(--c-${k});background:var(--c-${k}-bg)">${CATS[k].n}</span>`;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  const rows = DATA.filter(r =>
    (fMonth==="all" || r[0].slice(0,7)===fMonth) &&
    (fCat==="all" || r[1]===fCat) &&
    (fWho==="all" || r[2]===fWho) &&
    (fStatus==="all" ? true
      : fStatus==="urgent" ? isUrgent(r)
      : stateOf(r[5]) === fStatus));

  document.getElementById("liveCount").textContent = `${rows.length}건 표시 / 전체 ${DATA.length}건`;
  const rb = document.getElementById("restoreBtn");
  if(rb){
    rb.hidden = !deletedIds.length;
    rb.textContent = `삭제한 ${deletedIds.length}건 되돌리기`;
  }

  const list = document.getElementById("list");
  if(!rows.length){ list.innerHTML = `<p class="empty">조건에 맞는 업무가 없습니다.</p>` + ADD_ROW; return; }

  const ms = monthsIn();
  const maxMonth = Math.max(1, ...ms.map(m => DATA.filter(r=>r[0].slice(0,7)===m).length));
  let html = "";
  ms.forEach(m => {
    const mr = rows.filter(r => r[0].slice(0,7)===m);
    if(!mr.length) return;
    const total = DATA.filter(r=>r[0].slice(0,7)===m).length;
    html += `<section class="month">
      <div class="month-head">
        <h2>${monthLabel(m)}</h2>
        <span class="mcount">${mr.length}건${mr.length!==total?` / ${total}`:""}</span>
        <span class="mbar"><i style="width:${Math.round(total/maxMonth*100)}%"></i></span>
      </div>
      <ol class="rows">` +
      mr.map(r => {
        const st = stateOf(r[5]);
        const done = st === "done";
        const manual = r[7] === "m";
        const href = manual ? (r[6] || "") : (P + r[5]);
        void manual;
        const title = href
          ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(r[3])}</a>`
          : esc(r[3]);
        const urgent = isUrgent(r);
        return `<li class="row${done?" is-done":""}${st==="hold"?" is-hold":""}${urgent?" urgent":""}" data-id="${r[5]}">
        <span class="rdate">${r[0].slice(5).replace("-",".")}</span>
        ${catChip(r[1])}
        <div class="rbody">
          <p class="rtitle">${title}</p>
          <div class="rmeta">${urgent?`<span class="utag">당일 마감</span>`:""}<span class="who">${esc(r[2])}</span><span>요청</span>${
            r[7] === "m" ? `<span class="mtag">직접 추가</span>` : r[7] === "a" ? `<span class="atag">자동 수집</span>` : ""
          }${
            pendingRow === r[5]
              ? `<span class="delconf">삭제할까요?<button class="yes" type="button" data-delyes="${r[5]}">삭제</button><button class="no" type="button" data-delno="1">취소</button></span>`
              : `<button class="mdel" type="button" data-del="${r[5]}">삭제</button>`
          }</div>
          <p class="rdetail">${esc(r[4])}</p>
          ${noteBlock(r[5])}
        </div>
        ${statusBtnHtml(st)}
      </li>`;
      }).join("") +
      `</ol></section>`;
  });
  html += ADD_ROW;
  list.innerHTML = html;
  updateProgress();
}

/* click anywhere on a status button toggles that row */
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button.status");
  if(!b) return;
  const li = b.closest("li.row");
  const id = li.dataset.id;
  const next = nextOf(stateOf(id));
  setState(id, next);
  notionPush(id);
  li.classList.toggle("is-done", next === "done");
  li.classList.toggle("is-hold", next === "hold");
  applyBtn(b, next);
  updateProgress();
  if(fStatus !== "all") setTimeout(render, 220);
});

/* ---------- legend ---------- */
function buildLegend(){
  document.getElementById("legend").innerHTML =
    Object.keys(CATS).map(k =>
      `<div class="legend-item">${catChip(k)}<span>${CATS[k].d}</span></div>`).join("");
}

/* ---------- 업무 직접 추가 ---------- */
const addForm = document.getElementById("addForm");

function openAddForm(){
  const sel = document.getElementById("afCat");
  sel.innerHTML = Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].n}</option>`).join("");
  const d = addForm.elements.date;

  const row = document.getElementById("addRow");

document.getElementById("addCancel").onclick = closeAddForm;
document.getElementById("restoreBtn").onclick = restoreAll;

/* 목록 맨 아래 + 버튼 */

});

addForm.onsubmit = ev => {
  ev.preventDefault();
  const f = addForm.elements;
  const date = f.date.value;
  if(!date) return;

    f.cat.value,
    f.who.value.trim(),
    f.title.value.trim(),
    f.detail.value.trim(),
    id,
    "",
    "m"
  ]);
  setState(id, "wip");          // 새로 추가한 업무는 '진행중'으로 시작
  saveManual();
  addForm.reset();
  addForm.hidden = true;
  refreshTasks();
  notionBackfill();
};

/* 업무 삭제 — 한 번 누르면 확인, 다시 누르면 삭제 */
document.getElementById("list").addEventListener("click", ev => {
  const ask = ev.target.closest("button.mdel");
  if(ask){ pendingRow = ask.dataset.del; render(); return; }
  const yes = ev.target.closest("button[data-delyes]");
  if(yes){ deleteTask(yes.dataset.delyes); return; }
  const no = ev.target.closest("button[data-delno]");
  if(no){ pendingRow = null; render(); return; }
});

/* ---------- 가이드라인 카테고리 ---------- */
const GUIDE_LS = "gt-guides-v1";
let guides = [];                 // [{name, text}]
let view = "tasks";              // "tasks" | "guide"
let activeGuide = null;
let guidesRef = null, guideTimer = null;

function loadGuidesLocal(){
  try{
    const v = JSON.parse(localStorage.getItem(GUIDE_LS) || "null");
    if(Array.isArray(v)) guides = v.filter(g => g && typeof g.name === "string");
  }catch(e){ guides = []; }
}
function saveGuides(){
  try{ localStorage.setItem(GUIDE_LS, JSON.stringify(guides)); }catch(e){}
  if(guidesRef) guidesRef.set({ items: guides, updatedAt: new Date().toISOString() }).catch(()=>{});
}
async function initGuides(){
  if(!dbHandle) return;
  try{
    guidesRef = dbHandle.doc("guides/v1");
    guidesRef.onSnapshot(snap => {
      if(snap.exists && snap.data() && Array.isArray(snap.data().items)){
        const next = snap.data().items.filter(g => g && typeof g.name === "string");
        if(JSON.stringify(next) === JSON.stringify(guides)) return;
        const focused = document.activeElement === document.getElementById("guideText");
        guides = next;
        try{ localStorage.setItem(GUIDE_LS, JSON.stringify(guides)); }catch(e){}
        buildPills(); buildCatList();
        if(view === "guide" && !focused){
          if(!guides.some(g => g.name === activeGuide)) setView("tasks");
          else openGuide(activeGuide);
        }
      }
    }, () => {});
    const first = await guidesRef.get();
    if(!first.exists && guides.length){
      guidesRef.set({ items: guides, updatedAt: new Date().toISOString() }).catch(()=>{});
    }
  }catch(e){ guidesRef = null; }
}

function buildPills(){
  const p = document.getElementById("pills");
  p.innerHTML = "";
  const mk = (label, on, fn) => {
    const b = document.createElement("button");
    b.className = "pill"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-current", on ? "true" : "false");
    b.onclick = fn;
    p.appendChild(b);
  };
  mk("업무 현황", view === "tasks", () => setView("tasks"));
  guides.forEach(g => mk(g.name, view === "guide" && activeGuide === g.name, () => openGuide(g.name)));
}

function buildCatList(){
  const ul = document.getElementById("catList");
  ul.innerHTML = "";
  if(!guides.length){
    const d = document.createElement("li");
    d.className = "cat-empty";
    d.style.background = "none";
    d.textContent = "아직 카테고리가 없습니다. 아래에서 추가해 주세요.";
    ul.appendChild(d);
    return;
  }
  guides.forEach(g => {
    const li = document.createElement("li");
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = g.name;
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "rm"; rm.textContent = "×";
    rm.title = g.name + " 삭제";
    rm.onclick = () => {
      guides = guides.filter(x => x.name !== g.name);
      if(activeGuide === g.name) setView("tasks");
      saveGuides(); buildPills(); buildCatList();
    };
    li.appendChild(nm); li.appendChild(rm);
    ul.appendChild(li);
  });
}

function setView(v){
  view = v;
  const isTasks = v === "tasks";
  ["tabs","periodLine","progressBlock","stats","controls","list","legendBlock"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.hidden = !isTasks;
  });
  addForm.hidden = true;
  document.getElementById("guideView").hidden = isTasks;
  if(!isTasks){
    ["syncBar","notionBar"].forEach(id => { const el = document.getElementById(id); if(el) el.hidden = true; });
  }
  if(isTasks){ activeGuide = null; applyShell(); }
  buildPills();
  window.scrollTo({top:0, behavior:"smooth"});
}

function openGuide(name){
  const g = guides.find(x => x.name === name);
  if(!g) return setView("tasks");
  activeGuide = name;
  document.getElementById("guideTitle").textContent = name;
  document.getElementById("guideText").value = g.text || "";
  document.getElementById("guideSaved").textContent = "";
  setView("guide");
}

document.getElementById("hamBtn").onclick = function(){
  const panel = document.getElementById("hamPanel");
  const open = panel.hidden;
  panel.hidden = !open;
  this.setAttribute("aria-expanded", open ? "true" : "false");
  if(open){ buildCatList(); const i = panel.querySelector("input"); if(i) setTimeout(()=>i.focus(),0); }
};

document.getElementById("catAdd").onsubmit = function(ev){
  ev.preventDefault();
  const input = this.querySelector("input");
  const name = (input.value || "").trim().replace(/\s+/g," ");
  if(!name) return;
  if(!guides.some(g => g.name === name)) guides.push({name, text:""});
  input.value = "";
  saveGuides(); buildPills(); buildCatList();
  openGuide(name);
};

document.getElementById("guideText").addEventListener("input", function(){
  const g = guides.find(x => x.name === activeGuide);
  if(!g) return;
  g.text = this.value;
  document.getElementById("guideSaved").textContent = "저장 중…";
  clearTimeout(guideTimer);
  guideTimer = setTimeout(() => {
    saveGuides();
    document.getElementById("guideSaved").textContent = "저장됨";
  }, 500);
});

/* ---------- theme ---------- */
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur==="dark" : prefersDark;
  root.setAttribute("data-theme", isDark ? "light" : "dark");
};

loadRosterLocal();
loadManualLocal();
loadNotesLocal();
loadDeletedLocal();
pruneManual();
rebuildData();
loadGuidesLocal();
buildPills();
buildCatList();
buildTabs();
buildLegend();
applyShell();
if(DATA.length){ buildStats(); buildFilters(); render(); }
initStore();
syncSlack();
</script>
